name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sprintnest
          POSTGRES_PASSWORD: sprintnest
          POSTGRES_DB: sprintnest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # ─── Client Build ─────────────────────────────────
      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        run: npm run build

      # ─── Server Dependencies & Prisma ─────────────────
      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Validate Prisma schema
        working-directory: server
        env:
          DATABASE_URL: postgresql://sprintnest:sprintnest@localhost:5432/sprintnest_test
          DIRECT_URL: postgresql://sprintnest:sprintnest@localhost:5432/sprintnest_test
        run: npx prisma validate

      - name: Generate Prisma client
        working-directory: server
        env:
          DATABASE_URL: postgresql://sprintnest:sprintnest@localhost:5432/sprintnest_test
          DIRECT_URL: postgresql://sprintnest:sprintnest@localhost:5432/sprintnest_test
        run: npx prisma generate

      - name: Deploy Prisma migrations to test database
        working-directory: server
        env:
          DATABASE_URL: postgresql://sprintnest:sprintnest@localhost:5432/sprintnest_test
          DIRECT_URL: postgresql://sprintnest:sprintnest@localhost:5432/sprintnest_test
        run: npx prisma migrate deploy

      # ─── Quality Checks & Tests ───────────────────────
      - name: Server TypeScript typecheck
        working-directory: server
        run: npm run typecheck

      - name: Run server test suite
        working-directory: server
        env:
          NODE_ENV: test
          PORT: 3001
          DATABASE_URL: postgresql://sprintnest:sprintnest@localhost:5432/sprintnest_test
          DIRECT_URL: postgresql://sprintnest:sprintnest@localhost:5432/sprintnest_test
          REDIS_URL: redis://localhost:6379/1
          JWT_SECRET: test-jwt-secret-at-least-16-chars
          JWT_ACCESS_EXPIRY: 15m
          JWT_REFRESH_EXPIRY_DAYS: 7
          EMAIL_PROVIDER: console
          APP_URL: http://localhost:3001
        run: npm test

      - name: Build server (dist)
        working-directory: server
        run: npm run build
